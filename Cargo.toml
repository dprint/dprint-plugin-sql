[package]
name = "dprint-plugin-sql"
version = "0.3.0"
authors = ["David Sherret <dsherret@gmail.com>"]
edition = "2024"
homepage = "https://github.com/dprint/dprint-plugin-sql"
keywords = ["formatting", "formatter", "sql"]
license = "MIT"
repository = "https://github.com/dprint/dprint-plugin-sql"
description = "SQL formatter for dprint."

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = 3
debug = false
lto = true
debug-assertions = false
overflow-checks = false
panic = "abort"

[features]
wasm = ["serde_json", "dprint-core/wasm"]
tracing = ["dprint-core/tracing"]

[[test]]
name = "specs"
path = "tests/spec_test.rs"
harness = false

[dependencies]
dprint-core = { version = "0.71.0", features = ["formatting"], default-features = false }
dprint-core-macros = "0.1.0"
serde = { version = "1.0.88", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
thiserror = "2"

[dev-dependencies]
dprint-development = "0.12.1"
serde_json = { version = "1.0" }
